<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema de Agendamento e Controle para Aulas de Natação - Gerencie turmas, reservas e horários.">
    <title>AquaSchedule - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR (Simplificada para Login) -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav" id="mainNav">
        <div class="container">
            <a class="navbar-brand fw-800 d-flex align-items-center gap-2" href="#">
                <i class="bi bi-water fs-4 text-accent"></i>
                <span>Aqua<span class="text-accent">Schedule</span></span>
            </a>
        </div>
    </nav>

    <!-- SEÇÃO: LOGIN / REGISTRO -->
    <section id="authSection" class="min-vh-100 d-flex align-items-center justify-content-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <!-- Hero text -->
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-water display-1 text-accent"></i>
                        </div>
                        <h1 class="display-5 fw-800 mb-2">Aqua<span class="text-accent">Schedule</span></h1>
                        <p class="text-secondary fs-5">Sistema de Agendamento de Aulas de Natação</p>
                    </div>

                    <!-- Auth Card -->
                    <div class="card glass-card border-0 shadow-lg">
                        <div class="card-body p-4 p-lg-5">
                            <!-- Tabs -->
                            <ul class="nav nav-pills nav-fill mb-4 gap-2" id="authTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active rounded-pill" id="loginTab" data-bs-toggle="pill"
                                        data-bs-target="#loginPane" type="button" role="tab">
                                        <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link rounded-pill" id="registerTab" data-bs-toggle="pill"
                                        data-bs-target="#registerPane" type="button" role="tab">
                                        <i class="bi bi-person-plus me-1"></i>Registrar
                                    </button>
                                </li>
                            </ul>

                            <div class="tab-content">
                                <!-- Login Form -->
                                <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                                    <form id="loginForm" onsubmit="handleLogin(event)">
                                        <div class="mb-3">
                                            <label for="loginEmail" class="form-label fw-500">E-mail</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                                <input type="email" class="form-control" id="loginEmail"
                                                    placeholder="seu@email.com" required>
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label for="loginSenha" class="form-label fw-500">Senha</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                                <input type="password" class="form-control" id="loginSenha"
                                                    placeholder="••••••••" required>
                                            </div>
                                        </div>
                                        <button type="submit" class="btn btn-accent w-100 py-2 fw-600 rounded-pill" id="btnLogin">
                                            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                                        </button>
                                    </form>
                                </div>

                                <!-- Register Form -->
                                <div class="tab-pane fade" id="registerPane" role="tabpanel">
                                    <form id="registerForm" onsubmit="handleRegister(event)">
                                        <div class="mb-3">
                                            <label for="regNome" class="form-label fw-500">Nome Completo</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                                <input type="text" class="form-control" id="regNome"
                                                    placeholder="Seu nome" required>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="regEmail" class="form-label fw-500">E-mail</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                                <input type="email" class="form-control" id="regEmail"
                                                    placeholder="seu@email.com" required>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="regSenha" class="form-label fw-500">Senha</label>
                                            <div class="input-group">
                                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                                <input type="password" class="form-control" id="regSenha"
                                                    placeholder="Mínimo 6 caracteres" required minlength="6">
                                            </div>
                                        </div>
                                        <div class="mb-4">
                                            <label for="regRole" class="form-label fw-500">Perfil</label>
                                            <select class="form-select" id="regRole">
                                                <option value="Aluno">🏊 Aluno</option>
                                                <option value="Professor">👨‍🏫 Professor</option>
                                            </select>
                                        </div>
                                        <button type="submit" class="btn btn-accent w-100 py-2 fw-600 rounded-pill" id="btnRegister">
                                            <i class="bi bi-person-plus me-2"></i>Criar Conta
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <!-- Alert area -->
                            <div id="authAlert" class="mt-3" style="display:none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
