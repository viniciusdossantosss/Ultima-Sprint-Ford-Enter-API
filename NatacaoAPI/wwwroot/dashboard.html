<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AquaSchedule</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <!-- FullCalendar CSS -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css' rel='stylesheet' />

    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Ajustes específicos para o calendário no tema dark */
        #calendar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            min-height: 600px;
        }
        .fc-theme-standard td, .fc-theme-standard th {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .fc-theme-standard .fc-scrollgrid {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .fc-col-header-cell-cushion, .fc-daygrid-day-number {
            color: #f8f9fa;
            text-decoration: none;
        }
        .fc .fc-button-primary {
            background-color: var(--bs-accent);
            border-color: var(--bs-accent);
        }
        .fc .fc-button-primary:hover {
            background-color: #0088cc;
            border-color: #0088cc;
        }
        .fc .fc-button-primary:not(:disabled).fc-button-active {
            background-color: #0077b3;
            border-color: #0077b3;
        }
        
        /* Estilo dos eventos no calendário */
        .fc-event {
            cursor: pointer;
            border: none;
            padding: 2px 4px;
            border-radius: 4px;
        }
        .event-lotada {
            background-color: rgba(220, 53, 69, 0.8) !important; /* danger */
        }
        .event-vagas {
            background-color: rgba(13, 110, 253, 0.8) !important; /* accent */
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top glass-nav" id="mainNav">
        <div class="container">
            <a class="navbar-brand fw-800 d-flex align-items-center gap-2" href="#">
                <i class="bi bi-water fs-4 text-accent"></i>
                <span>Aqua<span class="text-accent">Schedule</span></span>
            </a>
            <div class="d-flex align-items-center gap-3" id="navUserArea">
                <span class="badge bg-accent-subtle text-accent-emphasis rounded-pill px-3 py-2" id="navUserRole"></span>
                <span class="text-light fw-500" id="navUserName"></span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" id="btnLogout" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>Sair
                </button>
            </div>
        </div>
    </nav>

    <!-- DASHBOARD SECTION -->
    <section id="dashboardSection" class="pt-5 mt-5">
        <div class="container py-4">
            <!-- Stats Cards -->
            <div class="row g-4 mb-4" id="statsRow">
                <div class="col-md-4">
                    <div class="card glass-card border-0 h-100 stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-accent-subtle">
                                <i class="bi bi-calendar-check text-accent fs-4"></i>
                            </div>
                            <div>
                                <p class="text-secondary mb-0 small">Turmas Disponíveis</p>
                                <h3 class="fw-800 mb-0" id="statTurmas">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card glass-card border-0 h-100 stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-success-subtle">
                                <i class="bi bi-bookmark-star text-success fs-4"></i>
                            </div>
                            <div>
                                <p class="text-secondary mb-0 small" id="statReservasLabel">Minhas Reservas</p>
                                <h3 class="fw-800 mb-0" id="statReservas">0</h3>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card glass-card border-0 h-100 stat-card">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="stat-icon bg-warning-subtle">
                                <i class="bi bi-person-badge text-warning fs-4"></i>
                            </div>
                            <div>
                                <p class="text-secondary mb-0 small">Seu Perfil</p>
                                <h3 class="fw-800 mb-0" id="statRole">-</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TURMAS (CALENDÁRIO) -->
            <div class="card glass-card border-0 shadow mb-4">
                <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center py-3 px-4">
                    <h5 class="fw-700 mb-0">
                        <i class="bi bi-calendar3 me-2 text-accent"></i>Agenda de Turmas
                    </h5>
                    <button class="btn btn-accent btn-sm rounded-pill px-3 professor-only" id="btnNovaTurma"
                        style="display:none;" data-bs-toggle="modal" data-bs-target="#turmaModal">
                        <i class="bi bi-plus-lg me-1"></i>Nova Turma
                    </button>
                </div>
                <div class="card-body p-3">
                    <!-- Contêiner do FullCalendar -->
                    <div id="calendar"></div>
                </div>
            </div>

            <!-- MINHAS RESERVAS (Tabela Mantida) -->
            <div class="card glass-card border-0 shadow">
                <div class="card-header bg-transparent border-0 py-3 px-4">
                    <h5 class="fw-700 mb-0">
                        <i class="bi bi-bookmark-star me-2 text-success"></i>
                        <span id="reservasTitle">Minhas Reservas</span>
                    </h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="reservasTable">
                            <thead class="table-dark">
                                <tr>
                                    <th class="ps-4">Turma</th>
                                    <th>Data e Hora</th>
                                    <th>Data da Reserva</th>
                                    <th>Status</th>
                                    <th class="text-end pe-4 aluno-only">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="reservasBody">
                                <tr><td colspan="5" class="text-center py-4 text-secondary">Carregando...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- MODAL: Criar/Editar Turma -->
    <div class="modal fade" id="turmaModal" tabindex="-1" aria-labelledby="turmaModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-700" id="turmaModalLabel">
                        <i class="bi bi-water me-2 text-accent"></i>Nova Turma
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="turmaForm" onsubmit="handleTurmaSubmit(event)">
                    <div class="modal-body">
                        <input type="hidden" id="turmaId">
                        <div class="mb-3">
                            <label for="turmaNome" class="form-label fw-500">Nome da Turma</label>
                            <input type="text" class="form-control" id="turmaNome" required placeholder="Ex: Turma Iniciante A">
                        </div>
                        <div class="mb-3">
                            <label for="turmaDescricao" class="form-label fw-500">Descrição</label>
                            <textarea class="form-control" id="turmaDescricao" rows="2" placeholder="Descrição da turma..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="turmaModalidade" class="form-label fw-500">Modalidade</label>
                            <select class="form-select" id="turmaModalidade" required>
                                <option value="Infantil">🧒 Infantil</option>
                                <option value="Adulto">🏊 Adulto</option>
                                <option value="Hidroginastica">💧 Hidroginástica</option>
                                <option value="Livre">🌊 Livre</option>
                            </select>
                        </div>
                        
                        <!-- NOVOS CAMPOS DATETIME-LOCAL -->
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label for="turmaInicio" class="form-label fw-500">Data e Hora de Início</label>
                                <input type="datetime-local" class="form-control" id="turmaInicio" required>
                            </div>
                            <div class="col-6">
                                <label for="turmaFim" class="form-label fw-500">Data e Hora de Término</label>
                                <input type="datetime-local" class="form-control" id="turmaFim" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-4">
                                <label for="turmaCapacidade" class="form-label fw-500">Vagas Totais</label>
                                <input type="number" class="form-control" id="turmaCapacidade" min="1" max="50" required value="10">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-accent rounded-pill px-4 fw-600" id="btnSaveTurma">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: Detalhes do Evento (Calendário) -->
    <div class="modal fade" id="eventoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-700" id="eventoModalTitle">Detalhes da Turma</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="eventoModalBody">
                    <!-- Preenchido via JS -->
                </div>
                <div class="modal-footer border-0" id="eventoModalFooter">
                    <!-- Preenchido via JS (Botões Reservar, Editar, Deletar) -->
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
        <div id="appToast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body fw-500" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- FullCalendar JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/pt-br.js'></script>

    <script src="app.js"></script>
</body>
</html>
