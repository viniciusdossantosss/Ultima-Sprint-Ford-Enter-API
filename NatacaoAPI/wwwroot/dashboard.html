<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — AquaSchedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css' rel='stylesheet' />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TOP NAV -->
    <nav class="top-nav glass-nav" id="mainNav">
        <div class="nav-brand">
            <svg viewBox="0 0 32 32" fill="none" width="28" height="28">
                <circle cx="16" cy="16" r="14" stroke="#06b6d4" stroke-width="2" fill="none"/>
                <path d="M6 20c4-4 8 4 12 0s8-4 12 0" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="nav-brand-text">Aqua<em>Schedule</em></span>
        </div>
        <div class="nav-tabs-center">
            <button class="nav-tab active" data-section="turmas" onclick="switchSection('turmas')">
                <i class="bi bi-calendar3"></i><span>Turmas</span>
            </button>
            <button class="nav-tab" data-section="reservas" onclick="switchSection('reservas')">
                <i class="bi bi-bookmark-star"></i><span>Reservas</span>
            </button>
            <button class="nav-tab admin-only" data-section="usuarios" onclick="switchSection('usuarios')" style="display:none">
                <i class="bi bi-people"></i><span>Usuários</span>
            </button>
        </div>
        <div class="nav-user" id="navUserArea">
            <span class="nav-role-badge" id="navUserRole"></span>
            <span class="nav-user-name" id="navUserName"></span>
            <button class="nav-logout" id="btnLogout" onclick="logout()" title="Sair">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
        <!-- STATS ROW -->
        <div class="stats-grid" id="statsRow">
            <div class="stat-card animate-in" style="--delay:0">
                <div class="stat-icon-wrap cyan"><i class="bi bi-calendar-check"></i></div>
                <div><p class="stat-label">Turmas</p><h3 class="stat-value" id="statTurmas">0</h3></div>
            </div>
            <div class="stat-card animate-in" style="--delay:1">
                <div class="stat-icon-wrap green"><i class="bi bi-bookmark-star"></i></div>
                <div><p class="stat-label" id="statReservasLabel">Minhas Reservas</p><h3 class="stat-value" id="statReservas">0</h3></div>
            </div>
            <div class="stat-card animate-in admin-only" style="--delay:2; display:none">
                <div class="stat-icon-wrap purple"><i class="bi bi-people"></i></div>
                <div><p class="stat-label">Alunos</p><h3 class="stat-value" id="statAlunos">0</h3></div>
            </div>
            <div class="stat-card animate-in admin-only" style="--delay:3; display:none">
                <div class="stat-icon-wrap amber"><i class="bi bi-mortarboard"></i></div>
                <div><p class="stat-label">Professores</p><h3 class="stat-value" id="statProfessores">0</h3></div>
            </div>
            <div class="stat-card animate-in" style="--delay:2">
                <div class="stat-icon-wrap amber"><i class="bi bi-person-badge"></i></div>
                <div><p class="stat-label">Seu Perfil</p><h3 class="stat-value" id="statRole">—</h3></div>
            </div>
        </div>

        <!-- SECTION: TURMAS (Calendar) -->
        <div id="sectionTurmas" class="content-section active">
            <div class="section-header">
                <h2><i class="bi bi-calendar3 me-2"></i>Agenda de Turmas</h2>
                <button class="btn-primary-custom btn-sm professor-only" id="btnNovaTurma"
                    style="display:none" data-bs-toggle="modal" data-bs-target="#turmaModal">
                    <i class="bi bi-plus-lg me-1"></i>Nova Turma
                </button>
            </div>
            <div class="glass-panel">
                <div id="calendar"></div>
            </div>
        </div>

        <!-- SECTION: RESERVAS -->
        <div id="sectionReservas" class="content-section">
            <div class="section-header">
                <h2><i class="bi bi-bookmark-star me-2"></i><span id="reservasTitle">Minhas Reservas</span></h2>
            </div>
            <div class="glass-panel p-0">
                <div class="table-responsive">
                    <table class="custom-table" id="reservasTable">
                        <thead>
                            <tr>
                                <th>Turma</th>
                                <th>Data e Hora</th>
                                <th>Data da Reserva</th>
                                <th>Status</th>
                                <th class="text-end aluno-only">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="reservasBody">
                            <tr><td colspan="5" class="text-center py-4 text-secondary">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- SECTION: USUARIOS (Admin Only) -->
        <div id="sectionUsuarios" class="content-section admin-only" style="display:none">
            <div class="section-header">
                <h2><i class="bi bi-people me-2"></i>Gestão de Usuários</h2>
                <button class="btn-primary-custom btn-sm" id="btnNovoUsuario"
                    data-bs-toggle="modal" data-bs-target="#usuarioModal">
                    <i class="bi bi-person-plus me-1"></i>Novo Usuário
                </button>
            </div>
            <div class="glass-panel p-0">
                <div class="table-responsive">
                    <table class="custom-table" id="usuariosTable">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                                <th>Perfil</th>
                                <th>Cadastrado em</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="usuariosBody">
                            <tr><td colspan="5" class="text-center py-4 text-secondary">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL: Criar/Editar Turma -->
    <div class="modal fade" id="turmaModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-700" id="turmaModalLabel">
                        <i class="bi bi-water me-2 text-accent"></i>Nova Turma
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="turmaForm" onsubmit="handleTurmaSubmit(event)">
                    <div class="modal-body">
                        <input type="hidden" id="turmaId">
                        <div class="mb-3">
                            <label for="turmaNome" class="form-label fw-500">Nome da Turma</label>
                            <input type="text" class="form-control" id="turmaNome" required placeholder="Ex: Turma Iniciante A">
                        </div>
                        <div class="mb-3">
                            <label for="turmaDescricao" class="form-label fw-500">Descrição</label>
                            <textarea class="form-control" id="turmaDescricao" rows="2" placeholder="Descrição..."></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="turmaModalidade" class="form-label fw-500">Modalidade</label>
                            <select class="form-select" id="turmaModalidade" required>
                                <option value="Infantil">🧒 Infantil</option>
                                <option value="Adulto">🏊 Adulto</option>
                                <option value="Hidroginastica">💧 Hidroginástica</option>
                                <option value="Livre">🌊 Livre</option>
                            </select>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label for="turmaInicio" class="form-label fw-500">Início</label>
                                <input type="datetime-local" class="form-control" id="turmaInicio" required>
                            </div>
                            <div class="col-6">
                                <label for="turmaFim" class="form-label fw-500">Término</label>
                                <input type="datetime-local" class="form-control" id="turmaFim" required>
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-4">
                                <label for="turmaCapacidade" class="form-label fw-500">Vagas</label>
                                <input type="number" class="form-control" id="turmaCapacidade" min="1" max="50" required value="10">
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-accent rounded-pill px-4 fw-600" id="btnSaveTurma">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: Detalhes do Evento -->
    <div class="modal fade" id="eventoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-700" id="eventoModalTitle">Detalhes da Turma</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="eventoModalBody"></div>
                <div class="modal-footer border-0" id="eventoModalFooter"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: Criar Usuário (Admin) -->
    <div class="modal fade" id="usuarioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-700">
                        <i class="bi bi-person-plus me-2 text-accent"></i>Novo Usuário
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="usuarioForm" onsubmit="handleCreateUsuario(event)">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="usuarioNome" class="form-label fw-500">Nome Completo</label>
                            <input type="text" class="form-control" id="usuarioNome" required placeholder="Nome do aluno/professor">
                        </div>
                        <div class="mb-3">
                            <label for="usuarioEmail" class="form-label fw-500">E-mail</label>
                            <input type="email" class="form-control" id="usuarioEmail" required placeholder="email@exemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="usuarioSenha" class="form-label fw-500">Senha</label>
                            <input type="password" class="form-control" id="usuarioSenha" required minlength="8"
                                placeholder="Mín. 8 chars: maiúsc, minúsc, número, especial"
                                pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#]).{8,}$">
                        </div>
                        <div class="mb-3">
                            <label for="usuarioRole" class="form-label fw-500">Perfil</label>
                            <select class="form-select" id="usuarioRole" required>
                                <option value="Aluno">🏊 Aluno</option>
                                <option value="Professor">👨‍🏫 Professor</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-accent rounded-pill px-4 fw-600" id="btnSaveUsuario">
                            <i class="bi bi-person-plus me-1"></i>Cadastrar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
        <div id="appToast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body fw-500" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <script src="app.js"></script>
</body>
</html>
